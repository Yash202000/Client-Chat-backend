# LiveKit SIP bridge — development defaults (keep key/secret in sync with livekit.yaml).
api_key: devkey
api_secret: agentconnect_dev_secret_change_me_0123456789
ws_url: ws://localhost:7880
redis:
  address: localhost:6379
sip_port: 5060
rtp_port: 10000-20000
# LAN testing with a softphone: advertise local IPs. Set to true when the telecom SIP trunk
# reaches this host through NAT.
use_external_ip: false
logging:
  level: debug
