# Side a local LiveKit address (127.0.0.1:7950) for LiveKit SIP, Egress and voice processes on this host:
# its own LiveKit node first; the other node when it is down (refused connections are retried there at once).
global
  maxconn 4096
defaults
  mode http
  option redispatch
  retries 2
  retry-on conn-failure empty-response response-timeout
  timeout connect 2s
  timeout client 1h
  timeout server 1h
  timeout tunnel 1h
frontend livekit
  bind 127.0.0.1:7950
  default_backend livekit_nodes
backend livekit_nodes
  balance first
  option httpchk GET /
  server own 127.0.0.1:7960 check inter 2s fall 2 rise 2
  server other 127.0.0.1:7970 check inter 2s fall 2 rise 2
