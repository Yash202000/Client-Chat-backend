
version: '3.8'

x-minio-common: &minio-common
  image: quay.io/minio/minio:latest
  command: server --console-address ":9090" /mnt/data
  ports:
    - "9000:9000"
    - "9090:9090"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
    interval: 30s
    timeout: 20s
    retries: 3

services:
  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    depends_on: [otel-collector]
    restart: always
    
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ${PWD}/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    restart: always

  chroma:
    image: chromadb/chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - CHROMA_OPEN_TELEMETRY__ENDPOINT=http://otel-collector:4317/
      - CHROMA_OPEN_TELEMETRY__SERVICE_NAME=chroma
    restart: always
    depends_on:
      - otel-collector
      - zipkin

  minio1:
    <<: *minio-common
    hostname: minio1
    restart: always
    volumes:
      - type: bind
        source: /mnt/data/agentconnect
        target: /mnt/data
      - type: bind
        source: /etc/default/minio
        target: /etc/config.env

  db:
    image: postgres:15
    restart: always
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agentconnect"], interval: 10s, timeout: 5s, retries: 5 }
    volumes:
      - agentconnect_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     agentconnect
      POSTGRES_PASSWORD: agentconnect

  # FastAPI Backend
  # backend:
  #   image: yashplg/agentconnect-backend:latest
  #   # build:
  #   #   context: .
  #   #   dockerfile: Dockerfile
  #   container_name: agentconnect-backend
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./generated_images:/app/generated_images
  #     - backend_logs:/app/logs
  #   ports:
  #     - "${BACKEND_PORT:-8000}:8000"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     chroma:
  #       condition: service_started
  #     minio1:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  # frontend:
  #   # IMPORTANT: Replace 'your-frontend-image:latest' with the actual name and tag of your built Docker image.
  #   image: yashplg/agentconnect-frontend:v1.7
  #   container_name: frontend_service
  #   ports:
  #     # Maps port 8080 on your local machine to port 80 in the container.
  #     # You can access your app at http://localhost:8080
  #     - "8080:80"
  #   environment:
  #     # These variables are now used at runtime by your container's startup script.
  #     - VITE_BACKEND_URL=https://agentconnect.com
  #     - VITE_LIVEKIT_URL=wss://intersee-isrh22yh.livekit.cloud
  #     - VITE_VOICE_ENGINE_URL=http://localhost:8001
  #   restart: always

  # ---------------------------------------------------------------- LiveKit (calls / contact centre)
  # Config files live in ./telephony (shared with telephony/docker-compose.yml — run one or the other,
  # not both: they use the same host ports). Setup + softphone testing: ./telephony/README.md
  #
  #   docker compose up -d redis livekit livekit-sip livekit-egress sip-registrar
  #   docker compose --profile voice up -d voice-agent      # AI / IVR voice process (needs .env)
  #
  # Host networking: LiveKit and LiveKit SIP need large UDP port ranges (Linux hosts only).
  #   6379 Redis · 7880/7881 LiveKit · 50000-60000/udp WebRTC · 5060 SIP (LiveKit) · 5080 SIP registrar
  #   (softphone logins) · 10000-20000/udp RTP

  redis:
    image: redis:7.4-alpine
    # persistent: LiveKit keeps SIP trunks and dispatch rules here
    command: ["redis-server", "--port", "6379", "--appendonly", "yes"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - livekit_redis:/data

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./telephony/livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]

  livekit-sip:
    image: livekit/sip:v1.15.0
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./telephony/sip.yaml:/sip/config.yaml:ro
    depends_on: [redis, livekit]

  livekit-egress:
    image: livekit/egress:v1.14.1   # call recordings -> MinIO / S3
    network_mode: host
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./telephony/egress.yaml:/etc/egress.yaml:ro
    depends_on: [redis, livekit]

  # SIP registrar for softphones (PortSIP, Zoiper, …): logins are HeyGenAlly users' SIP accounts
  # (Contact Center → SIP phones). Listens on TELEPHONY_SIP_REGISTRAR_ADDRESS (udp+tcp, default :5080)
  # and forwards calls to LiveKit SIP. Reads the kamailio_subscriber view in the app database.
  # SIP registrar (softphone logins). Image: telephony/kamailio/build.sh; standalone deploy:
  # telephony/kamailio/docker-compose.deploy.yml. DB login: KAMAILIO_DB_URL (read-only role).
  sip-registrar:
    build:
      context: ./telephony/kamailio
      args: {VERSION: "1.1.0"}
    image: agentconnect-sip-registrar:1.1.0
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SIP_SERVER_ID: "1"
      SIP_PEERS: ${SIP_REGISTRAR_PEERS:-}
    read_only: true
    tmpfs: ["/run/kamailio:uid=100,gid=101,mode=0750", "/tmp"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [livekit-sip]

  # Second registrar sharing the registrations in the database (high availability; see telephony/HA.md).
  #   SIP_REGISTRAR_PEERS=192.168.31.107:5082 docker compose --profile ha up -d sip-registrar sip-registrar-2
  sip-registrar-2:
    profiles: ["ha"]
    image: agentconnect-sip-registrar:1.1.0
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SIP_SERVER_ID: "2"
      TELEPHONY_SIP_REGISTRAR_ADDRESS: ${SIP_REGISTRAR_2_ADDRESS:-192.168.31.107:5082}
      SIP_PEERS: ${SIP_REGISTRAR_PEERS_2:-192.168.31.107:5080}
    read_only: true
    tmpfs: ["/run/kamailio:uid=100,gid=101,mode=0750", "/tmp"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [livekit-sip]

  # AgentConnect voice process: answers AI / IVR phone calls (app/agents/contact_center_agent.py).
  # Uses the backend image and .env (LIVEKIT_*, REDIS_URL, DATABASE_URL, speech keys).
  voice-agent:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.agents.contact_center_agent", "start"]
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    depends_on: [livekit, livekit-sip, redis]

  # Documentation Service - Docusaurus
  docs:
    build:
      context: ../docs
      dockerfile: Dockerfile
      target: development  # Use 'production' for prod deployment
    container_name: agentconnect_docs
    ports:
      - "3001:3000"  # Dev server on port 3001
    volumes:
      - ../docs:/app  # Mount docs folder for hot reload
      - /app/node_modules  # Prevent overwriting node_modules
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    # For production, uncomment below and comment above:
    # docs-prod:
    #   build:
    #     context: ../docs
    #     dockerfile: Dockerfile
    #     target: production
    #   container_name: agentconnect_docs
    #   ports:
    #     - "3001:80"
    #   restart: always


volumes:
  chroma_data:
  agentconnect_db:
  backend_logs:
  livekit_redis:
